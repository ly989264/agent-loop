[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop"
version = "0.1.0"
description = "Generic exploration-loop kernel: pick a failing probe, run one agent round, verify, notify."
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
agent-loop = "agent_loop.cli:main"

[tool.setuptools]
packages = ["agent_loop", "agent_loop.adapters"]
